# Universal miqaat catalog.
#
# This is the SUPERSET. No jamaat observes all of these with a masjid function.
# Each jamaat's config.yaml selects the subset it programs and supplies local
# timing. Adding an entry here does not put it on anyone's calendar.
#
# `day` is the CANONICAL Hijri date of the miqaat. It is not necessarily the
# day the program is held -- that is `observed_offset` in the jamaat config.
#
# `recurrence: monthly` means the entry fires in every Hijri month; `month` is
# then ignored.

miqaats:

  # --- Moharram ul Haraam (1) ---
  - id: ashara-mubaraka
    name: Ashara Mubaraka
    month: 1
    day: 1
    duration_days: 10
    category: ashara

  - id: ashura
    name: Yaum-e-Ashura
    month: 1
    day: 10
    category: ashara
    note: >-
      The day programme runs from the morning waaz until maghrib, so it is one
      long block rather than a waaz and a separate majlis.

  # Ashara programmes run 2mi-9mi. Nothing is held on 1mi, and 10mi is Ashura
  # itself, which is a single all-day programme rather than a waaz plus majlis.
  - id: ashara-waaz
    name: Ashara Mubaraka - Waaz
    month: 1
    day_range: [2, 9]
    category: ashara

  - id: ashara-raat-majlis
    name: Ashara Mubaraka - Raat ni Majlis
    month: 1
    day_range: [2, 9]
    category: ashara

  - id: urus-hatim-mohiyuddin
    name: Urus - Syedna Hatim Mohiyuddin (RA), 3rd Dai al-Mutlaq
    month: 1
    day: 16
    category: urus

  - id: urus-fakhruddin-shaheed
    name: Urus - Syedi Fakhruddin Shaheed (AQ)
    month: 1
    day: 26
    category: urus

  # --- Safar ul Muzaffar (2) ---
  - id: chehlum
    name: Chehlum - Imam Husain (AS)
    month: 2
    day: 20
    category: majlis
    note: >-
      Observance day varies by jamaat and by year. Anjuman-e-Burhani NJ held
      this on 20mi in 1447H and 19mi in 1448H. Always confirm.

  - id: shahadat-imam-hasan
    name: Shahadat - Imam Hasan (AS)
    month: 2
    day: 28
    category: majlis
    note: >-
      Observance day varies. ABNJ held 28mi in 1447H, 27mi in 1448H.

  # --- Rabi ul Awwal (3) ---
  - id: milad-un-nabi
    name: Milad un Nabi (SAW)
    month: 3
    day: 12
    category: milad
    note: Commonly programmed on 11mi as an evening waaz.

  - id: urus-mohammed-burhanuddin
    name: Urus Mubarak - Syedna Mohammed Burhanuddin (RA), 52nd Dai al-Mutlaq
    month: 3
    day: 14
    duration_days: 3
    category: urus
    note: >-
      The urus is 16mi per mumineen.org. ABNJ holds three raat majlis ending on
      the raat of 16mi (25-27 Aug 2026), so 14mi-16mi with observed_offset -1.

  # --- Rabi ul Akhar (4) ---
  - id: salgirah-imamuz-zaman
    name: Salgirah Mubarak - Imamuz Zaman (SA)
    month: 4
    day: 4
    category: milad
    note: >-
      ABNJ announced the raat on 3mi (25 Sep 2025), so canonical 4mi with
      observed_offset -1.

  - id: milad-mohammed-burhanuddin
    name: Milad Mubarak - Syedna Mohammed Burhanuddin (RA), 52nd Dai al-Mutlaq
    month: 4
    day: 20
    category: milad
    note: >-
      Announced with Aapna Mansoos Syedna Mufaddal Saifuddin (TUS). Raat majlis
      on 19mi (30 Sep 2026), day programme on 20mi in 1447H.

  # --- Jamadil Ula (5) ---
  - id: shahadat-fatema
    name: Shahadat raat - Maulatena Fatema tuz Zehra (SA)
    month: 5
    day: 10
    category: majlis
    note: >-
      10mi per mumineen.org. ABNJ held the shahadat raat majlis on the evening
      of 9mi (30 Oct 2025), so observed_offset -1.

  # --- Jamadil Ukhra (6) ---
  - id: urus-ismail-badruddin
    name: Urus - Syedna Ismail Badruddin (RA), Jamnagar
    month: 6
    day: 22
    category: urus

  - id: urus-qutubuddin-shaheed
    name: Lailate Urus - Syedna Qutubuddin Shaheed (AQ)
    month: 6
    day: 26
    category: urus

  # --- Rajab ul Asab (7) ---
  - id: pehli-raat-rajab
    name: Pehli raat - Rajab ul Asab
    month: 7
    day: 1
    category: majlis
    note: Held the evening before 1mi Rajab, so observed_offset -1.

  - id: urus-noormohammed-nooruddin
    name: Urus - Syedna NoorMohammed Nooruddin (AQ), Mandvi
    month: 7
    day: 3
    category: urus

  - id: milad-amirul-mumineen
    name: Milad Mubarak - Amirul Mumineen (AS)
    month: 7
    day: 13
    category: milad
    note: ABNJ announced the milad raat on 12mi, so observed_offset -1.

  - id: ayyam-barakat-khuldiyah
    name: Ayyamul Barakatil Khuldiyah - Khatmul Quran ni Majlis
    month: 7
    day_range: [17, 18]
    category: majlis
    note: >-
      The two nights before the urus of Syedna Taher Saifuddin (RA). ABNJ
      announced them for the evenings of 16mi and 17mi, so observed_offset -1.

  - id: urus-taher-saifuddin
    name: Urus Mubarak - Syedna Taher Saifuddin (RA), 51st Dai al-Mutlaq
    month: 7
    day: 19
    category: urus
    note: Lailat ul urus waaz held on the evening of 18mi, so observed_offset -1.

  - id: urus-abdul-qadir-najmuddin
    name: Urus - Syedna Abdul Qadir Najmuddin (AQ), 47th Dai al-Mutlaq, Ujjain
    month: 7
    day: 26
    category: urus
    note: >-
      26mi per mumineen.org (47th Dai). ABNJ held it on the evening of 26mi,
      the same evening as the Lailatul Meraj raat. Not the same person as Syedi
      Abdul Qadir Hakimuddin in Shawwal.

  - id: lailatul-meraj
    name: Lailatul Meraj
    month: 7
    day: 27
    category: majlis

  - id: ayyam-ul-beez
    name: Ayyam ul Beez - Salatuz Zawaal
    month: 7
    day_range: [13, 15]
    category: majlis
    note: >-
      The white days. ABNJ announced these for Rajab only, so the entry is
      scoped to Rajab rather than to every month.

  # --- Shabaan ul Kareem (8) ---
  - id: urus-hurratul-maleka
    name: Urus - Maulatena Hurratul Maleka (RA)
    month: 8
    day: 21
    category: urus

  - id: shab-e-barat
    name: Shab-e-Barat
    month: 8
    day: 15
    category: majlis

  # --- Shehrullah il Moazzam (9) ---
  - id: shehrullah
    name: Shehrullah il Moazzam
    month: 9
    day: 1
    duration_days: 30
    category: seasonal
    note: Month-long banner. Shehrullah is a kamil month, always 30 days.

  - id: shehrullah-evening
    name: Shehrullah - Evening program
    month: 9
    day_range: [1, 30]
    category: majlis
    note: >-
      Tilawat and bayan before maghrib/isha namaz, then niyaz na jaman. The
      jamaat announces one timing for the whole month and revises it as maghrib
      shifts, so this is one repeated programme rather than thirty distinct ones.

  - id: matam-majlis-ramadan
    name: Matam ni Majlis - 11mi raat Shehrullah
    month: 9
    day: 11
    category: majlis

  - id: khatmul-quran-shehrullah
    name: Khatmul Quran ni Majlis - Shehrullah
    month: 9
    day_range: [4, 6]
    category: majlis
    note: ABNJ held this on 4th-6th Shehrullah in 1447H. May not recur every year.

  - id: misaaq-majlis
    name: Misaaq ni Majlis
    month: 9
    day: 13
    category: majlis

  - id: shahadat-ameerul-mumineen
    name: Shahadat - Ameerul Mumineen (AS)
    month: 9
    day: 19
    category: majlis
    note: 19mi per mumineen.org.

  - id: aakhri-jumoa
    name: Aakhri Jumoa
    month: 9
    weekday: friday
    which: last
    category: majlis
    note: >-
      The last Friday of Shehrullah, so the Hijri day moves each year. In 1447H
      it fell on 25mi.

  - id: lailatus-salaseen
    name: Lailatus Salaseen - Ahya ul Lail
    month: 9
    day: 30
    category: majlis
    note: >-
      The aakhri raat of Shehrullah. Held the evening before, so jamaats set
      observed_offset -1.

  - id: lailatul-qadr
    name: Lailatul Qadr
    month: 9
    day: 23
    category: majlis

  # --- Shawwal ul Mukarram (10) ---
  - id: eid-ul-fitr
    name: Eid ul Fitr
    month: 10
    day: 1
    category: eid

  - id: eid-raat
    name: Eid ul Fitr - Raat
    month: 10
    day: 1
    category: eid
    note: >-
      Held the evening before Eid, so jamaats set observed_offset -1. Separate
      from the Eid namaz on the day itself.

  - id: urus-abdul-qadir-hakimuddin
    name: Urus - Syedi Abdul Qadir Hakimuddin (AQ)
    month: 10
    day: 26
    category: urus

  # --- Zilqadatil Haraam (11) ---
  - id: urus-abduttaiyeb-abdeali
    name: >-
      Urus - Syedna Abduttaiyeb Zakiyuddin (RA), Jamnagar
      and Syedna Abdeali Saifuddin (RA), Surat
    month: 11
    day: 11
    category: urus

  - id: milad-taher-saifuddin
    name: Milad Mubarak - Syedna Taher Saifuddin (AQ), 51st Dai al-Mutlaq
    month: 11
    day: 27
    category: milad

  # --- Zilhijjatil Haraam (12) ---
  - id: yaumul-arafa
    name: Yaumul Arafa
    month: 12
    day: 9
    category: eid

  - id: eid-ul-adha
    name: Eid ul Adha
    month: 12
    day: 10
    category: eid

  - id: ghadir-e-khum
    name: Eid-e-Ghadir-e-Khum (Eidillah il-Akbar)
    month: 12
    day: 18
    category: eid

  - id: urus-abdul-husain-husamuddin
    name: Urus - Syedna Abdul Husain Husamuddin (AQ), 48th Dai al-Mutlaq
    month: 12
    day: 27
    category: urus
    note: >-
      27mi per mumineen.org (48th Dai). ABNJ held the urus raat majlis on the
      evening of 27mi (12 Jun 2026).

  # --- Every Hijri month ---
  - id: darees-majlis
    name: 16mi raat Darees ni Majlis
    recurrence: monthly
    day: 16
    skip_months: [9]           # Shehrullah has its own nightly programme
    category: majlis
    note: >-
      Held on the niyyat of Syedna Hatim Mohiyuddin (RA), Syedna Taher
      Saifuddin (RA) and Al Hayyul Muqaddas Syedna Mohammed Burhanuddin (RA).
      Typically programmed on 15mi as an evening majlis (16mi raat).
